# Galileo User Manual - build configuration.
# Paths are relative to this file.

[manual]
title      = "Galileo"
subtitle   = "User Manual"
version    = "auto"            # "auto" = read ../Galileo/pyproject.toml; override with --version
author     = "Gord Tulloch"
copyright  = "Copyright (c) Gord Tulloch. Galileo is free software licensed under the GPL-3.0."
page_size  = "Letter"          # or "A4"
toc_depth  = 2                 # 1 = chapters only, 2 = chapters + section headings
output     = "build/Galileo-Manual.pdf"
front_cover = "Front cover (Letter)@2x.png"
rear_cover  = "Rear cover (Letter)@2x (2).png"

[paths]
docx    = "chapters"           # the manual's source documents (Word)
wiki    = "../Galileo.wiki"    # target of "docx_tools.py export-wiki --to-wiki"
galileo = "../Galileo"         # for local copies of screenshots referenced by the wiki

# Chapters, in print order. Word is the source of truth: each entry names a file in chapters/.
#   docx = "<file in chapters/>"   (edit it in Word)
# Optional: title = "..." (override), appendix = true.
# (wiki = "..." still works for a chapter taken straight from the wiki Markdown.)

# Chapters map one-to-one onto wiki articles. A chapter entry can also take a slice of an article
# ("from"/"until" = ## heading names, "until" exclusive; give each slice an "id" and "title"), or fold other
# articles in as sections with "append" = [...] (headings demoted one level; links to them resolve here).
[[chapter]]
docx = "01.-Installation.docx"

[[chapter]]
docx = "02.-Getting-Started.docx"

[[chapter]]
docx = "03.-Setting-up-Equipment.docx"

[[chapter]]
docx = "04.-Using-the-Star-Atlas.docx"

[[chapter]]
docx = "05.-Planning-Functions.docx"

[[chapter]]
docx = "06.-Imaging.docx"

[[chapter]]
docx = "07.-Using-the-Focus-Screen.docx"

[[chapter]]
docx = "08.-Guiding-with-PHD2.docx"

[[chapter]]
docx = "09.-Using-Plate-Solving.docx"

[[chapter]]
docx = "10.-The-Galileo-Image-Library.docx"

[[chapter]]
docx = "14.-Built-in-Help.docx"

[[chapter]]
docx = "17.-Using-NodeConnect.docx"

[[chapter]]
docx = "18.-Using-WebConnect.docx"

[[chapter]]
docx = "19.-Using-MobileConnect-for-IOS-and-Android.docx"

[[chapter]]
docx = "A.-Plugin-Developers-Guide.docx"
appendix = true

# Appendix B is an intro document with the two plugin articles folded in as sections
# (headings demoted one level; links to them resolve here).
[[chapter]]
docx = "B.-Plugins-Documentation.docx"
appendix = true
append = ["B1.-Science-Variable-Stars.docx", "B2.-AllSkyCam.docx"]
